# ==================================================
# General
# ==================================================

# Use tmux's 256-color terminal definition.
set-option -g default-terminal "tmux-256color"

# Enable true color inside tmux when running under WezTerm.
set-option -as terminal-features ",xterm-256color:RGB"

# Reduce the delay after pressing Esc.
# Important for Neovim normal-mode transitions.
set-option -sg escape-time 10

# Forward terminal focus events to applications such as Neovim.
set-option -g focus-events on

# Start window and pane numbering from 0.
set-option -g base-index 0
set-window-option -g pane-base-index 0

# Keep window numbers compact after closing a window.
set-option -g renumber-windows on

# Increase scrollback history.
set-option -g history-limit 100000

# Enable mouse support for pane selection, resizing and scrolling.
set-option -g mouse on


# ==================================================
# Window and Pane
# ==================================================

# Create new windows and panes in the current working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Reload this configuration.
bind-key r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# Resize panes more conveniently.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5


# ==================================================
# Status Bar
# ==================================================

set-option -g status on
set-option -g status-interval 5

# Keep the status bar simple.
set-option -g status-left-length 30
set-option -g status-right-length 60

set-option -g status-left "[#S] "
set-option -g status-right "%Y-%m-%d %H:%M"

set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format " #I:#W* "


# ==================================================
# Copy Mode
# ==================================================

# Use vi-style keys in copy mode.
set-window-option -g mode-keys vi
